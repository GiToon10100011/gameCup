name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      # CI 빌드용 스텁 환경 변수 — 실제 키가 아님. 빌드 단계에서 env 가드 통과용.
      NEXT_PUBLIC_SUPABASE_URL: https://stub-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: stub_anon_key_for_ci_build_only
      NEXT_PUBLIC_RAWG_KEY: stub_rawg_key_for_ci_build_only
      NEXT_PUBLIC_RAWG_BASE_URL: https://api.rawg.io/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint (next lint)
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build (Next.js)
        run: npm run build

  hook-verify:
    name: Husky hook · lint-staged dry run
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify pre-commit hook exists and is executable
        run: |
          test -x .husky/pre-commit || (echo "::error::.husky/pre-commit missing or not executable" && exit 1)
          echo "Pre-commit hook present:"
          cat .husky/pre-commit

      - name: Verify lint-staged config resolves
        run: npx lint-staged --help > /dev/null

      - name: Run lint-staged against full diff vs base
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          npx lint-staged --diff="origin/${{ github.base_ref }}...HEAD" --no-stash
